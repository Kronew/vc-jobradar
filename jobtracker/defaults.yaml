# Standardwerte des Trackers. Persönliches (Stellenart, Profil, Ort, Bereiche, VCs) kommt aus
# settings.yaml, die über das Einstellungsformular gepflegt wird (siehe README). Wer mehr anpassen will,
# legt eine config.yaml an: sie wird über diese Werte gelegt (Listen ersetzen, Abschnitte werden zusammengeführt).

search:
  max_days_old: 2          # nur Stellen der letzten N Tage (VC-Boards: siehe sources.vc_boards.max_days_old)

location:
  # Remote-Stellen verwerfen, wenn der Ort auf diese Länder/Regionen beschränkt ist
  remote_exclude_regions:
    [usa$, us$, united states, america, canada, uk$, united kingdom, london, ireland, india,
     brazil, latam, apac, asia, australia, singapore, philippines, poland, polen, spain, spanien,
     portugal, france, frankreich, italy, italien, romania, turkey, ukraine]



filters:
  # Pflichtwörter im Titel kommen aus den gewählten job_types.
  # Ausschluss, wenn einer dieser Begriffe im Titel steht (Wortanfang, Groß/Klein egal)
  title_exclude:
    [abschlussarbeit, masterarbeit, bachelorarbeit, thesis, ausbildung, azubi, duales studium,
     dual student, minijob, promoter, promotion team, call center, callcenter, telefonist,
     kommissionier, lager, fahrer, kellner, service kraft, kassierer, nachhilfe]
  exclude_staffing_agencies: false
  accept_homeoffice_possible: false
title_only_categories: false   # false = auch Beschreibung für die Zuordnung nutzen (Titel hat Vorrang)

scoring:
  enabled: true            # wird automatisch übersprungen, wenn ANTHROPIC_API_KEY fehlt
  model: claude-haiku-5-5  # günstigstes aktuelles Claude-Modell
  min_score: 6
  batch_size: 15

storage:
  path: data/seen_jobs.json
  retention_days: 60

mail:
  send_when_empty: true
  subject: "🎯 VC-Jobradar – {date} – {count}"   # {count} = "1 neue Stelle" / "3 neue Stellen"
  max_jobs: 60             # Obergrenze pro Mail

http:
  timeout: 20
  delay_seconds: 1.0       # Pause zwischen Requests derselben Quelle


# Startup-Hochburgen zum Ankreuzen im Formular (weitere Städte über das Feld „Andere Stadt“).
# aliases: Ortsnamen für Stellen ohne Koordinaten (fast alle Getro-Stellen haben welche)
startup_cities:
  berlin: {label: Berlin, lat: 52.5200, lon: 13.4050, aliases: [berlin, potsdam]}
  muenchen: {label: München, lat: 48.1372, lon: 11.5755, aliases: [münchen, munich, garching, unterföhring, ismaning]}
  hamburg: {label: Hamburg, lat: 53.5511, lon: 9.9937, aliases: [hamburg, norderstedt]}
  koeln: {label: Köln, lat: 50.9375, lon: 6.9603, aliases: [köln, cologne, bonn, leverkusen]}
  frankfurt: {label: Frankfurt am Main, lat: 50.1109, lon: 8.6821, aliases: [frankfurt am main, frankfurt/main, offenbach, eschborn]}

# Stellenarten zum Ankreuzen. queries = Suche bei Getro, title_words = Pflichtwörter im Titel,
# exclusive_excludes = zusätzliche Ausschlüsse, wenn nur diese Stellenart gesucht wird
job_types:
  werkstudent:
    label: Werkstudentenstellen
    short: Werkstudent
    queries: [werkstudent, working student]
    title_words:
      [werkstudent, werkstudierend, working student, studentische aushilfe, studentische hilfskraft,
       studentischer mitarbeiter, studentische mitarbeiterin, student assistant, werkstudium]
    exclusive_excludes:
      [vollzeit, full-time, fulltime, full time, pflichtpraktikum, vollzeitpraktikum, praxissemester]
  praktikum:
    label: Praktika
    short: Praktikum
    queries: [praktikum, praktikant, internship, intern]
    title_words:
      [praktikum, praktika, praktikant, pflichtpraktikum, internship, intern$, interns$, stage$, stagiaire]
    exclusive_excludes: []

sources:
  vc_boards:
    enabled: true          # Portfolio-Jobbörsen von VCs (Getro, kein Key nötig)
    max_days_old: 60       # Boards sind klein; nicht größer als storage.retention_days (sonst Wiederholungen)
    other_cities: true     # Stellen außerhalb des Radius (nur DE) im Abschnitt „Andere Städte“ zeigen
    # Suchbegriffe kommen aus job_types (je nach gewählter Stellenart)
    # network_id: Seitenquelltext der Jobseite → "network":{"id":"…"}
    boards:
      - {name: HV Capital, network_id: 234}            # jobs.hvcapital.com
